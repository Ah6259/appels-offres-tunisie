# Mise à jour quotidienne : lecture HAICOP + Douane (enchères) + formulaire des entreprises -> construction du site -> tests
# -> alerte Telegram -> commit (GitHub Pages republie tout seul).
# En cas de panne de la source : anciennes données gardées, issue GitHub « Source HAICOP en panne depuis le … »
# ouverte (ou complétée), puis refermée automatiquement quand la lecture remarche.
name: maj-appels-offres
on:
  schedule:
    - cron: "5 5 * * *"        # 6h05 heure de Tunis, chaque jour
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximum de fiches à lire"
        default: "40"
concurrency:
  group: maj-site              # groupe commun à tous les robots qui écrivent dans ce dépôt
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  TZ: Africa/Tunis
  PYTHONIOENCODING: utf-8
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lecture lente du portail HAICOP
        id: lecture
        run: |
          set +e
          python robot/lire_haicop.py --max "${{ github.event.inputs.max || '40' }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0     # une panne ne doit pas arrêter le robot : le site garde les anciennes données

      - name: Ventes aux enchères (page officielle de la Douane, 1 page)
        run: python robot/lire_douane.py || echo "échec : ventes aux enchères non lues (anciennes gardées)"

      - name: Appels d'offres des entreprises privées (formulaire Google, si configuré)
        run: python robot/prives.py || echo "échec : publications des entreprises non lues (anciennes gardées)"

      - name: Construction du site
        run: python robot/construire_site.py

      - name: Tests (le site n'est publié que si tout est bon)
        run: |
          npm install --no-save --no-package-lock jsdom
          node tools/test_site.mjs
          python tools/test_pannes.py

      - name: Alerte Telegram du jour (rien si les secrets n'existent pas)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python robot/telegram.py || echo "échec : alerte Telegram (le site n'est pas touché)"

      - name: Commit des données et des pages
        run: |
          git config user.name "robot-appels-offres"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees index.html sitemap.xml a-propos metier gouvernorat publier encheres
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Appels d'offres du $(date +'%d/%m/%Y %H:%M')"
          git push

      - name: Alerte si la source est en panne (issue GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_LECTURE: ${{ steps.lecture.outputs.code }}
        run: |
          python - <<'PY' > alerte.env
          import json, os, shlex
          e = json.load(open("donnees/etat-source.json", encoding="utf-8"))
          panne = e["source_en_panne"]
          raison = e.get("raison") or ""
          if os.environ.get("CODE_LECTURE", "0") != "0" and not panne:
              panne, raison = True, "le robot de lecture s'est arrêté en erreur (voir le journal)"
          d = (e.get("depuis") or e.get("derniere_lecture_reussie") or "")[:10]
          q = lambda v: shlex.quote(str(v))
          print(f"PANNE={'1' if panne else '0'}")
          print("DEPUIS=" + q(f"{d[8:10]}/{d[5:7]}/{d[0:4]}" if d else "?"))
          print("RAISON=" + q(raison))
          print("JOURS=" + q(e.get("jours_sans_lecture")))
          print("DERNIERE=" + q(e.get("derniere_lecture_reussie") or "?"))
          PY
          cat alerte.env
          set -a; . ./alerte.env; set +a
          JOURNAL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NUM=$(gh issue list --state open --search "Source HAICOP en panne in:title" --json number --jq '.[0].number // empty')
          if [ "$PANNE" = "1" ]; then
            if [ -z "$NUM" ]; then
              gh issue create --title "Source HAICOP en panne depuis le $DEPUIS" --body "Le robot n'a pas pu lire correctement le portail HAICOP.

          - Raison : $RAISON
          - Dernière lecture réussie : $DERNIERE
          - Journal : $JOURNAL

          Le site garde les anciennes annonces (les expirées disparaissent seules). Un bandeau daté prévient les visiteurs
          quand la dernière lecture a 2 jours ou plus. Cette issue se fermera toute seule quand la lecture remarchera.
          Que faire : voir README, section « Plan de continuité »."
            else
              gh issue comment "$NUM" --body "Toujours en panne ($(date +'%d/%m/%Y %H:%M')) — $JOURS jour(s) sans lecture réussie. Raison : $RAISON. Journal : $JOURNAL"
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "La source HAICOP remarche : lecture réussie le $DERNIERE. Fermeture automatique."
          fi
