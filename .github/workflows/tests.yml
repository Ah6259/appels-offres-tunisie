# Tests à chaque modification envoyée (push) : on ne garde pas un site qui ne passe pas les tests.
name: tests
# Audit des robots du 10/10/2026 : pas de tests pour un envoi qui ne change que des notes (.md) ; un nouvel envoi annule le précédent.
on:
  push:
    branches: [main, "entretien-tests/**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fichiers des robots lisibles par GitHub (YAML valide)
        run: |
          pip install --quiet pyyaml pillow
          python -c "import yaml,glob; [print('OK', f, list((yaml.safe_load(open(f, encoding='utf-8')) or {}).get(True) or [])) for f in sorted(glob.glob('.github/workflows/*.yml'))]"
      - run: npm install --no-save --no-package-lock jsdom
      - name: Test du site (pages, filtres, liens HAICOP, FR/AR, SEO)
        run: node tools/test_site.mjs
      - name: Test du service worker (installation sur le telephone)
        run: node tools/test_sw.mjs
      - name: Test de la vidéo de présentation et du bouton Partager
        run: node tools/test_video.mjs
      - name: Test de la section Votre avis (envoi Formspree simule)
        run: node tools/test_avis.mjs
      - name: Scénarios de panne des robots
        run: python tools/test_pannes.py
      - name: Rapports du mois (chiffres = données, mois fini figé, pas de fausse évolution, plan du site)
        run: python tools/test_rapports.py
      - name: Visiteur simule (comme un visiteur sur telephone, avant le vrai visiteur - regle generale du 18/10/2026)
        run: python tools/visiteur_simule.py
