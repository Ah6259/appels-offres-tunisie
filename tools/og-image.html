<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(100deg,rgba(22,48,74,.96) 0%,rgba(36,71,107,.86) 55%,rgba(36,71,107,.35) 100%),url(../assets/photos/chantier-monastir.jpg) right center/cover no-repeat;font-family:Figtree,sans-serif;color:#fff;position:relative}
.g{position:absolute;left:72px;top:64px;width:600px}
.marque{display:flex;align-items:center;gap:16px;font-weight:800;font-size:28px}
.marque img{width:64px;height:64px}
h1{font-size:62px;line-height:1.05;margin:44px 0 18px;letter-spacing:-.02em}
p{font-size:27px;margin:0;opacity:.92;font-weight:600}
.ar{font-family:"Noto Kufi Arabic",sans-serif;direction:rtl;text-align:left;font-size:24px;white-space:nowrap;margin-top:16px;opacity:.9}
.badges{position:absolute;left:72px;bottom:58px;display:flex;gap:12px}
.badges span{background:rgba(255,255,255,.14);border-radius:999px;padding:10px 20px;font-weight:700;font-size:21px}
.badges span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#7CF0BE;margin-right:10px;vertical-align:2px}
.c{position:absolute;right:64px;width:400px;background:#fff;color:#0F1E2E;border-radius:22px;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-left:7px solid #24476B}
.c1{top:96px;transform:rotate(2deg)} .c2{top:330px;border-left-color:#C2412F;transform:rotate(-1.5deg)}
.p{display:inline-block;background:#E6EDF5;color:#24476B;border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px;margin-right:6px}
.l{height:14px;background:#DCE3EB;border-radius:7px;margin:14px 0 0}
.d{display:flex;gap:10px;margin-top:16px}
.d div{flex:1;background:#F2F6FA;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;color:#5A6878}
.d b{display:block;font-size:20px;color:#0F1E2E}
.c2 .d div:first-child{background:#FBEAE7} .c2 .d div:first-child b{color:#C2412F}
.credit{position:absolute;right:18px;bottom:12px;font-size:15px;font-weight:600;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.6)}
</style></head><body>
<div class="g">
  <div class="marque"><img src="../assets/logo.svg" alt="">Alertes appels d'offres</div>
  <h1>Appels d'offres publics en Tunisie</h1>
  <p>Chaque jour, par métier et par gouvernorat.</p>
  <div class="ar">طلبات العروض العمومية في تونس، كل يوم ومجانًا</div>
</div>
<div class="badges"><span>Source officielle HAICOP</span><span>Gratuit, sans inscription</span></div>
<div class="credit">Photo : Habib M'henni, CC BY 4.0, Wikimedia Commons</div>
